[project]
name = "living-screener-mcp"
version = "0.2.0"
description = "Review-only hosted MCP for market scans, trade plans, risk checks, journaling, and postmortems."
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=3.4.2",
  "starlette>=0.37.0",
  "uvicorn>=0.35.0",
  "python-dotenv>=1.0.1",
  "yfinance>=0.2.40",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
